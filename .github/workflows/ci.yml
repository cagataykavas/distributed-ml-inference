name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Verify the built wheel in isolation
        run: |
          python -m venv /tmp/inference-wheel
          /tmp/inference-wheel/bin/pip install dist/*.whl
          /tmp/inference-wheel/bin/python -c "from inference.service import app; assert app.title == 'Distributed ML Inference'"
      - name: Produce SLO-gated reference evidence
        run: python reference_benchmark.py --requests 200 --concurrency 32
      - uses: actions/upload-artifact@v4
        with:
          name: inference-reference-evidence
          path: artifacts/reference-load.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t distributed-ml-inference:ci .
      - name: Smoke-test container lifecycle
        run: |
          docker run -d --name inference-ci -p 8000:8000 distributed-ml-inference:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          docker logs inference-ci
          exit 1
