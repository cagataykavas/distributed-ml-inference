[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ml-inference"
version = "0.2.0"
description = "Async dynamically-batched ML inference service with observability"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "prometheus-client>=0.20",
  "numpy>=1.26"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["batcher"]
packages = ["inference"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
